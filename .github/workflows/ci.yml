name: Java CI/CD with Maven

on:
  push:
    branches: [ "environment/hello" ]
  pull_request:
    branches: [ "environment/hello" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache de dependencias Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven

      - name: Compilar y testear con Maven
        run: mvn -B clean verify

      - name: Analizar con SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn sonar:sonar -Dsonar.projectKey=cyber-dev-matrix_ci-cd-springboot-introduce -Dsonar.organization=cyber-dev-matrix -Dsonar.host.url=https://sonarcloud.io -Dsonar.login=$SONAR_TOKEN

      - name: Revisar dependencias con OWASP
        run: mvn org.owasp:dependency-check-maven:check

